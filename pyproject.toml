[project]
name = "paperwriter"
version = "0.1.0"
description = "Literature-first paper writing (outline, draft, review, revision, LaTeX export, citation verification) extracted from AutoResearchClaw."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]
readme = "paperwriter/README.md"
license = {text = "MIT"}

[project.optional-dependencies]
anthropic = ["httpx>=0.24"]
bedrock = ["boto3>=1.34"]
arxiv = ["arxiv>=2.1"]
dev = ["pytest>=7.0"]

[project.scripts]
paperwriter = "paperwriter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["paperwriter", "researchclaw"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
